<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataForge AI | Advanced Data Architect</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #4da6ff; --danger: #ff4d4d; --success: #2ecc71; --bg: #0f0f0f; --card: #1a1a1a; }
        body { background-color: var(--bg); color: #e0e0e0; font-family: 'Inter', sans-serif; display: flex; justify-content: center; padding: 40px 20px; }
        .container { max-width: 900px; width: 100%; background: var(--card); padding: 35px; border-radius: 16px; border: 1px solid #333; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        h1 { margin: 0 0 10px 0; color: #fff; font-size: 28px; }
        p { color: #888; font-size: 14px; margin-bottom: 30px; }
        
        /* Layout Styles */
        .field-row { display: flex; gap: 12px; margin-bottom: 12px; animation: slideIn 0.2s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        
        input, select { background: #111; color: #fff; border: 1px solid #444; padding: 12px; border-radius: 8px; font-size: 14px; flex: 1; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); }
        input.error { border-color: var(--danger); background: #2a1515; }

        .remove-btn { background: #331a1a; color: #ff4d4d; border: 1px solid #552222; padding: 0 15px; cursor: pointer; border-radius: 8px; }
        .add-btn { background: #222; color: #ccc; width: 100%; border: 1px dashed #444; padding: 12px; margin: 10px 0 25px 0; cursor: pointer; border-radius: 8px; font-weight: 600; }
        .add-btn:hover { background: #2a2a2a; color: #fff; }

        .config-bar { display: flex; gap: 20px; align-items: center; margin-bottom: 25px; padding: 15px; background: #111; border-radius: 10px; }
        .btn-gen { background: var(--primary); color: #000; width: 100%; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-bottom: 15px; transition: 0.3s; }
        .btn-gen:hover { opacity: 0.9; transform: translateY(-2px); }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 10px; }
        .btn-dl { background: #333; color: #fff; border: 1px solid #444; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }

        textarea { width: 100%; height: 250px; margin-top: 20px; background: #0a0a0a; color: #4da6ff; border: 1px solid #333; border-radius: 10px; padding: 15px; font-family: 'Fira Code', monospace; font-size: 13px; resize: vertical; box-sizing: border-box; }
        
        /* Toast Notification Styles */
        #toast { visibility: hidden; min-width: 280px; color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 10; bottom: 30px; font-weight: bold; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #toast.show { visibility: visible; animation: fadeInOut 2.5s; }
        @keyframes fadeInOut { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
    </style>
</head>
<body>

<div class="container">
    <h1>DataForge AI</h1>
    <p>Precision-engineered synthetic data for modern developers.</p>
    
    <div id="fieldsContainer">
        <div class="field-row">
            <input type="text" placeholder="Field Name" class="f-name" value="id">
            <select class="f-type">
                <option value="serial">Serial Number</option>
                <option value="name">Full Name</option>
                <option value="email">Email Address</option>
                <option value="city">City (India)</option>
                <option value="status">Status (Active/Inactive)</option>
                <option value="phone">Phone Number</option>
            </select>
        </div>
    </div>

    <button class="add-btn" onclick="addNewField()">+ Add Another Field</button>

    <div class="config-bar">
        <div style="flex:2"><label style="font-size:11px;color:#666">Table Name</label><input type="text" id="tableName" value="Users"></div>
        <div style="flex:1"><label style="font-size:11px;color:#666">Rows</label><input type="number" id="rowCount" value="100"></div>
        <div style="flex:1"><label style="font-size:11px;color:#666">Format</label>
            <select id="outFormat"><option value="sql">SQL Insert</option><option value="json">JSON Array</option><option value="csv">CSV Text</option></select>
        </div>
    </div>

    <button class="btn-gen" onclick="generateData()">GENERATE DATASET</button>
    
    <div class="btn-group" id="downloadGroup" style="display:none">
        <button class="btn-dl" onclick="downloadExcel()">Download Excel</button>
        <button class="btn-dl" onclick="downloadFile('csv')">Download CSV</button>
        <button class="btn-dl" onclick="downloadFile('json')">Download JSON</button>
    </div>

    <textarea id="output" readonly placeholder="Your generated data will appear here..."></textarea>
</div>

<div id="toast"></div>

<script>
    let rawData = [];
    const names = ["Camryn", "Trey", "Hasan", "Shelly", "Tyreek", "Aysha", "Zackery", "Daniela", "Kaya", "Karl", "Ken", "Patricia", "Forrest", "Tasia", "Blake", "Maximus", "Ashleigh", "Rudy", "Trevon", "Jalin", "Genevieve", "Montserrat", "Elyse", "Jocelyn", "Brennen", "Jayvon", "Keana", "Gary", "Kalob", "Joel", "Kim", "Destiny", "Desean", "Donnell", "Deja", "Kori", "Daija", "Valentina", "Zoie", "Raphael", "Trever", "Nathaly", "Destini", "Leonardo", "Devin", "Ashely", "Areli", "Bryce", "Avery", "Tehya", "Ajay", "Sylvia", "Denisse", "Lora", "Cyrus", "Triston", "Julien", "Andie", "Amanda", "Marie", "Kelvin", "Kameryn", "Bridget", "Jacklyn", "Sheyla", "Tyler", "Stella", "Rashawn", "Toni", "Stone", "Carla", "Kelsi", "Jaren", "Phoebe", "Ashanti", "Holden", "Keanna", "Anastasia", "Jon", "Kacey", "Brycen", "Edwin", "Mikael", "Stephanie", "Yosef", "Emilia", "Judy", "Jamie", "Kalen", "Treasure", "Sara", "Kaycee", "Raekwon", "Lizeth", "Dylon", "Mikaela", "Susan", "Javion", "Brodie", "Georgia"];

    const cities = ["Tokyo",  "Delhi","India",  "Shanghai","China", "Sao Paulo", "Brazil", "Mexico City", "Mexico", "Cairo", "Egypt", "Dhaka", "Bangladesh", "Mumbai",  "Beijing",  "Osaka",  "Karachi",  "Chongqing",  "Istanbul", "Turkey", "Buenos Aires", "Argentina", "Kolkata",  "Lagos", "Nigeria", "Kinshasa", "DR Congo", "Manila", "Philippines", "Tianjin",  "Guangzhou",  "Rio de Janeiro", "Brazil", "Lahore",  "Bangalore",  "Moscow",  "Shenzhen",  "Bogota", "Colombia", "Jakarta",  "Chennai",  "Lima", "Peru", "Bangkok", "Thailand", "Seoul", "South Korea", "Nagoya",  "Hyderabad",  "London", "UK", "Tehran", "Iran", "Chicago",  "Chengdu",  "Nanjing",  "Wuhan",  "Ho Chi Minh City", "Vietnam", "Luanda", "Angola", "Ahmedabad",  "Kuala Lumpur", "Malaysia", "Xi'an",  "Hong Kong",  "Dongguan",  "Hangzhou",  "Foshan",  "Shenyang",  "Riyadh", "Saudi Arabia", "Baghdad", "Iraq", "Santiago", "Chile", "Surat",  "Madrid", "Spain", "Suzhou",  "Pune",  "Harbin",  "Houston",  "Dallas",  "Toronto", "Canada", "Dar es Salaam", "Tanzania", "Miami",  "Belo Horizonte", "Brazil", "Singapore", "Singapore", "Philadelphia",  "Atlanta",  "Fukuoka",  "Khartoum", "Sudan", "Barcelona", "Spain", "Johannesburg", "South Africa", "Saint Petersburg",  "Qingdao",  "Dalian",  "Washington",  "Yangon", "Myanmar", "Alexandria", "Egypt", "Jinan",  "Guadalajara", "Mexico", "Abidjan", "Ivory Coast", "Addis Ababa", "Ethiopia", "Guatemala City", "Guatemala", "Nairobi", "Kenya", "Ankara", "Turkey", "Rome", "Italy", "Kiev", "Ukraine", "Taipei", "Taiwan", "Recife", "Brazil", "Brasilia", "Brazil", "Amman", "Jordan", "Casablanca", "Morocco", "Berlin", "Germany", "Algiers", "Algeria", "Sana'a", "Yemen", "Machala", "Ecuador", "Pyongyang", "North Korea", "Kabul", "Afghanistan", "Surabaya",  "Medellin", "Colombia", "Faisalabad",  "Izmir", "Turkey", "Changsha",  "Maceio", "Brazil", "Dakar", "Senegal", "Accra", "Ghana", "Kampala", "Uganda", "Curitiba", "Brazil", "Porto Alegre", "Brazil", "Peshawar",  "Quito", "Ecuador"];

    // 1. Function to Add Dynamic Rows
    function addNewField() {
        const div = document.createElement('div');
        div.className = 'field-row';
        div.innerHTML = `
            <input type="text" placeholder="Field Name" class="f-name">
            <select class="f-type">
                <option value="name">Full Name</option>
                <option value="email">Email</option>
                <option value="phone">Phone Number</option>
                <option value="age">Age</option>
                <option value="city">City</option>
                <option value="status">Status</option>
                <option value="serial">Serial Number</option>
            </select>
            <button class="remove-btn" onclick="this.parentElement.remove()">X</button>`;
        document.getElementById('fieldsContainer').appendChild(div);
    }

    // 2. Professional Toast Notification
    function showToast(msg, type = 'success') {
        const toast = document.getElementById("toast");
        toast.innerText = msg;
        toast.style.backgroundColor = type === 'error' ? '#ff4d4d' : '#2ecc71';
        toast.className = "show";
        setTimeout(() => { toast.className = ""; }, 2500);
    }

    // 3. Core Engine: Validation & Generation
    function generateData() {
        const rows = document.querySelectorAll('.field-row');
        let schema = [];
        let usedNames = new Set();
        let errorFound = false;

        // Validation Loop
        rows.forEach((row, index) => {
            const input = row.querySelector('.f-name');
            const val = input.value.trim();
            input.classList.remove('error');

            if (val === "") {
                showToast("Error: Field name cannot be empty!", "error");
                input.classList.add('error');
                input.focus();
                errorFound = true;
            } else if (usedNames.has(val.toLowerCase())) {
                showToast(`Error: Field name '${val}' must be unique!`, "error");
                input.classList.add('error');
                input.focus();
                errorFound = true;
            }
            
            if (errorFound) return; 
            usedNames.add(val.toLowerCase());
            schema.push({ name: val, type: row.querySelector('.f-type').value });
        });

        if (errorFound) return; // Stop if errors exist

        // Generation logic
        const count = document.getElementById('rowCount').value;
        rawData = [];
        for(let i=1; i<=count; i++) {
            let obj = {};
            schema.forEach(s => {
                if(s.type === 'serial') obj[s.name] = i;
                else if(s.type === 'name') obj[s.name] = names[Math.floor(Math.random()*names.length)];
                else if(s.type === 'email') obj[s.name] = `user${i}@example.com`;
                else if(s.type === 'phone') obj[s.name] = "9" + Math.floor(100000000 + Math.random() * 900000000);
                else if(s.type === 'age') obj[s.name] = Math.floor(Math.random()*40)+20;
                else if(s.type === 'city') obj[s.name] = cities[Math.floor(Math.random()*cities.length)];
                else if(s.type === 'status') obj[s.name] = Math.random() > 0.5 ? "Active" : "Inactive";
                else obj[s.name] = "2026-05-03";
            });
            rawData.push(obj);
        }

        renderOutput();
        showToast("Dataset generated successfully!", "success");
        document.getElementById('downloadGroup').style.display = 'grid';
    }

    // 4. Output Formatter
    function renderOutput() {
        const format = document.getElementById('outFormat').value;
        const tName = document.getElementById('tableName').value || "Table";
        let out = "";
        if(format === 'sql') {
            out = `CREATE TABLE ${tName} (\n ${Object.keys(rawData[0]).map(k=>k+" VARCHAR").join(",\n ")}\n);\n\n`;
            rawData.forEach(r => out += `INSERT INTO ${tName} VALUES ('${Object.values(r).join("','")}');\n`);
        } else if(format === 'json') {
            out = JSON.stringify(rawData, null, 2);
        } else {
            out = Object.keys(rawData[0]).join(",") + "\n" + rawData.map(r=>Object.values(r).join(",")).join("\n");
        }
        document.getElementById('output').value = out;
    }

    // 5. Export Functions
    function downloadExcel() {
        const ws = XLSX.utils.json_to_sheet(rawData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Data");
        XLSX.writeFile(wb, `${document.getElementById('tableName').value}.xlsx`);
    }

    function downloadFile(ext) {
        const content = document.getElementById('output').value;
        const blob = new Blob([content], {type: 'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${document.getElementById('tableName').value}.${ext}`;
        a.click();
    }
</script>
</body>
</html>
